name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ipa_regex: 'linux-(amd64|x64)'
            ipa_ext: ''
          - os: windows-latest
            rid: win-x64
            ipa_regex: 'windows-(amd64|x64)'
            ipa_ext: '.exe'
          - os: macos-latest
            rid: osx-arm64
            ipa_regex: 'macos-arm64|ios-arm64'
            ipa_ext: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Publish self-contained single file
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Bundle ipatool binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url=""
          for attempt in 1 2 3 4 5; do
            json=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/majd/ipatool/releases/latest || true)
            url=$(printf '%s' "$json" \
              | jq -r '.assets[]? | select(.name | test("${{ matrix.ipa_regex }}")) | .browser_download_url' \
              | head -n1 || true)
            [ -n "$url" ] && break
            echo "Attempt $attempt: no matching asset (rate limit / transient API failure); retrying..."
            sleep $((attempt * 10))
          done
          if [ -z "$url" ]; then
            echo "No matching ipatool asset for ${{ matrix.rid }}"; exit 1
          fi
          echo "Downloading ipatool: $url"
          curl -sL "$url" -o ipatool-dl
          mkdir -p ipatool-ex
          tar -xzf ipatool-dl -C ipatool-ex
          bin=$(find ipatool-ex -type f -name 'ipatool*${{ matrix.ipa_ext }}' | head -n1)
          if [ -z "$bin" ]; then
            echo "ipatool binary not found inside archive"; ls -R ipatool-ex; exit 1
          fi
          cp "$bin" "publish/ipatool${{ matrix.ipa_ext }}"
          chmod +x "publish/ipatool${{ matrix.ipa_ext }}" 2>/dev/null || true
          echo "Bundled: publish/ipatool${{ matrix.ipa_ext }}"

      - name: Selftest (published binary)
        run: |
          if [ "${{ matrix.rid }}" = "win-x64" ]; then BIN=publish/AppOogst.exe; else BIN=publish/AppOogst; fi
          "$BIN" --selftest

      - name: Package (Linux AppImage)
        if: matrix.rid == 'linux-x64'
        run: |
          set -euo pipefail
          bash scripts/build-appimage.sh publish "${GITHUB_REF_NAME#v}" "AppOogst-${GITHUB_REF_NAME}-linux-x64.AppImage"
          ls -lh AppOogst-*

      - name: Package (Windows single-file zip)
        if: matrix.rid == 'win-x64'
        run: |
          set -euo pipefail
          mkdir -p "AppOogst-${GITHUB_REF_NAME}-win-x64"
          cp publish/AppOogst.exe "AppOogst-${GITHUB_REF_NAME}-win-x64/AppOogst.exe"
          cp publish/ipatool.exe "AppOogst-${GITHUB_REF_NAME}-win-x64/ipatool.exe"
          powershell -NoProfile -Command "Compress-Archive -Path 'AppOogst-${GITHUB_REF_NAME}-win-x64' -DestinationPath 'AppOogst-${GITHUB_REF_NAME}-win-x64.zip'"
          ls -lh AppOogst-*

      - name: Package (macOS app bundle + dmg)
        if: matrix.rid == 'osx-arm64'
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          bash scripts/build-macos-app.sh publish "$VER" "AppOogst-${GITHUB_REF_NAME}-osx-arm64.dmg"
          codesign --verify --deep AppOogst.app
          ls -lh AppOogst-*

      - name: Attach release assets
        uses: softprops/action-gh-release@v2
        with:
          files: AppOogst-*
